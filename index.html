<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="color-scheme" content="light">
  <meta name="description" content="AIDC is The Ace Base developer console for registering applications and configuring OAuth 2.0, OpenID Connect, redirects, scopes, credentials, branding, and activity.">
  <meta name="application-name" content="AIDC">
  <meta name="keywords" content="AIDC, Ace Base, Ace Identity, OAuth, OpenID Connect, OIDC, developer console, identity platform">
  <link rel="canonical" href="https://aidc.ace-base.cc/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AIDC | Ace Base Developer Console">
  <meta property="og:description" content="Developer console for Ace Base Identity applications, OAuth, OpenID Connect, credentials, redirects, scopes, and branding.">
  <meta property="og:url" content="https://aidc.ace-base.cc/">
  <meta property="og:image" content="https://aidc.ace-base.cc/assets/icon.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="AIDC | Ace Base Developer Console">
  <meta name="twitter:description" content="Manage Ace Base Identity applications and OAuth/OIDC configuration.">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>AIDC | Ace Base Developer Console</title>

  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"WebApplication",
    "name":"AIDC",
    "url":"https://aidc.ace-base.cc/",
    "description":"The Ace Base developer console for Identity applications, OAuth, OpenID Connect, credentials, redirects, scopes, and branding.",
    "applicationCategory":"DeveloperApplication",
    "operatingSystem":"Web Browser",
    "publisher":{
      "@type":"Organization",
      "name":"The Ace Base",
      "url":"https://ace-base.cc/"
    }
  }
  </script>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="/assets/icon.png">
  <link rel="apple-touch-icon" href="/assets/icon.png">

  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/monochrome.css">
</head>

<body>
  <main id="app" aria-label="AIDC">
    <aidc-app></aidc-app>

    <noscript>
      <section class="aidc-noscript">
        <div>
          <h1>JavaScript is required</h1>
          <p>AIDC requires JavaScript to run.</p>
        </div>
      </section>
    </noscript>
  </main>

  <script>
    /*
     * Fallback UI for the case where app.js (or one of its
     * imports such as api.js) fails to load. Without this,
     * the page is left blank because <aidc-app> never gets
     * registered as a custom element.
     */
    window.setTimeout(function () {
      if (customElements.get("aidc-app")) {
        return;
      }

      var app = document.getElementById("app");

      if (!app || app.textContent.trim()) {
        return;
      }

      app.innerHTML =
        '<section style="padding:2rem;' +
        'font:14px/1.55 ui-sans-serif,system-ui,sans-serif;' +
        'color:#111110;max-width:36rem;margin:0 auto">' +
        '<h1 style="margin:0 0 8px;font-size:20px;font-weight:600">' +
        "Failed to load AIDC" +
        "</h1>" +
        '<p style="margin:0;color:#777773">' +
        "The interface could not be initialised. Open the browser " +
        "console for details — most commonly this means a module " +
        "failed to load." +
        "</p>" +
        "</section>";
    }, 2500);
  </script>

    <noscript><p>AIDC is the developer console for Ace Base Identity. JavaScript is required to manage applications and OAuth/OIDC configuration.</p></noscript>
<script type="module" src="/profile-ui.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
