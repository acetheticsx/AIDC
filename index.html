    <noscript><section class="aidc-noscript"><div><h1>AIDC</h1><p>AIDC is The Ace Base Identity Developer Console for creating and managing identity applications and configuring OAuth 2.0 and OpenID Connect integrations.</p><h2>What does AIDC do?</h2><p>AIDC manages application configuration, redirect URIs, OAuth scopes, client credentials, branding, authentication analytics, and application activity.</p><h2>How does AIDC work with Ace ID?</h2><p>AIDC manages application configuration for Ace ID. Ace ID provides the production OpenID Connect identity service used by configured applications.</p><h2>How are application origins verified?</h2><p>AIDC can verify configured Origin URLs with DNS TXT challenges. Cloudflare-managed domains can optionally use automatic TXT record creation.</p><p><a href="https://docs.ace-base.cc/projects/aidc">Read the AIDC documentation</a></p></div></section></noscript>
