name: Refactor large modules

on:
  push:
    branches:
      - refactor/performance-modularization

permissions:
  contents: write

jobs:
  refactor:
    if: "!contains(github.event.head_commit.message, '[auto-refactor]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply refactor and performance fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path(".")
          server = root / "server/server.js"
          src = server.read_text()

          route_start = src.index("/*\n * ═══════════════════════════════════════════\n * Applications")
          route_end = src.index("/*\n * ═══════════════════════════════════════════\n * Frontend", route_start)
          prefix, routes, suffix = src[:route_start], src[route_start:route_end], src[route_end:]

          # Move API/application routes into a dedicated module. Dependencies are
          # passed explicitly, avoiding hidden globals while keeping startup order.
          decls = set(re.findall(r'^(?:const|let|var|function|class)\\s+([A-Za-z_$][\\w$]*)', prefix, re.M))
          decls |= set(re.findall(r'^import\\s+(?:([A-Za-z_$][\\w$]*)|\\{([^}]+)\\})\\s+from', prefix, re.M)[0][0:0])
          named = set()
          for m in re.finditer(r'^import\\s+\\{([^}]+)\\}\\s+from', prefix, re.M):
              for item in m.group(1).split(","):
                  item = item.strip().split(" as ")[-1].strip()
                  if re.match(r'^[A-Za-z_$][\\w$]*$', item):
                      named.add(item)
          for m in re.finditer(r'^import\\s+([A-Za-z_$][\\w$]*)', prefix, re.M):
              named.add(m.group(1))
          deps = sorted(n for n in (decls | named) if re.search(r'\\b' + re.escape(n) + r'\\b', routes))

          dep_params = ", ".join(deps)
          route_module = (
              "/* API/application routes. Dependencies are explicit to keep the server boundary testable. */\\n"
              f"export function registerApiRoutes({{{dep_params}}}) {{\\n"
              + routes
              + "\n}\n"
          )

          import_line = 'import { registerApiRoutes } from "./api-routes.js";\\n'
          insert_at = prefix.rfind("\n", 0, prefix.find("import ", 0))
          # Put the route-module import immediately after the existing imports.
          import_matches = list(re.finditer(r'^import[^;]+;\\n', prefix, re.M))
          if not import_matches:
              raise SystemExit("No imports found in server.js")
          import_end = import_matches[-1].end()
          prefix = prefix[:import_end] + import_line + prefix[import_end:]

          call = (
              "\nregisterApiRoutes({"
              + ", ".join(deps)
              + "});\n\n"
          )
          server.write_text(prefix + call + suffix)
          (root / "server/api-routes.js").write_text(route_module)

          # Keep the DB pool configurable and avoid holding transactions open while
          # waiting for a remote entitlement service.
          s = server.read_text()
          s = s.replace("max: 10,", "max: Number(process.env.AIDC_DB_POOL_MAX) || 10,")
          server.write_text(s)

          # Move entitlement lookup before BEGIN in application creation.
          routes_path = root / "server/api-routes.js"
          r = routes_path.read_text()
          r = r.replace(
              'const client = await pool.connect();\\n\\n    try {\\n      await client.query("BEGIN");',
              'const entitlements = await getAceIdEntitlements(req.developer.id);\\n\\n    const client = await pool.connect();\\n\\n    try {\\n      await client.query("BEGIN");',
              1
          )
          r = r.replace(
              '      const entitlements = await getAceIdEntitlements(req.developer.id);\\n'
              '      if (entitlements.status !== "active"',
              '      if (entitlements.status !== "active"',
              1
          )
          routes_path.write_text(r)

          # Short TTL entitlement cache. Subscription state is intentionally kept
          # short-lived so plan changes converge quickly without blocking requests.
          r = routes_path.read_text()
          marker = 'async function getAceIdEntitlements(developerId) {'
          cache = '''const entitlementCache = new Map();
const ENTITLEMENT_CACHE_TTL_MS =
  Math.max(Number(process.env.AIDC_ENTITLEMENT_CACHE_TTL_MS) || 30_000, 5_000);

'''
          r = r.replace(marker, cache + marker, 1)
          r = r.replace(
              '  const userId = String(developerId || "").trim();\n  if (!userId) throw new Error("entitlement_user_required");',
              '  const userId = String(developerId || "").trim();\n  if (!userId) throw new Error("entitlement_user_required");\n\n  const cached = entitlementCache.get(userId);\n  if (cached && cached.expiresAt > Date.now()) return cached.value;\n  entitlementCache.delete(userId);',
              1
          )
          r = r.replace(
              '      verified: true\n    };',
              '      verified: true\n    };\n\n    entitlementCache.set(userId, { value: result, expiresAt: Date.now() + ENTITLEMENT_CACHE_TTL_MS });\n    return result;',
              1
          )
          # The replacement above changes the existing return shape, so remove the
          # old direct return wrapper if present.
          r = r.replace('    return {\n      plan,', '    const result = {\n      plan,', 1)
          routes_path.write_text(r)

          # Remove the now-dead Playground health request while retaining discovery
          # diagnostics from the server's normal OIDC health path.
          app = root / "app.js"
          if app.exists():
              a = app.read_text()
              a = a.replace('        api.playground.config()\\n', '')
              a = a.replace('const [redirectResult, credentialResult, scopeResult, discoveryResult] =',
                            'const [redirectResult, credentialResult, scopeResult] =')
              a = a.replace('\\n    const discovery = discoveryResult.status === "fulfilled" ? discoveryResult.value : null;', '')
              app.write_text(a)

          # Split ui.js at a component boundary, preserving its single registration
          # entry point and explicitly passing its local context to the second module.
          ui = root / "ui.js"
          u = ui.read_text()
          split_marker = "  class AIDCScopes"
          pos = u.index(split_marker)
          tail_marker = "\n  customElements.define("
          tail = u.rfind(tail_marker)
          if tail < pos:
              raise SystemExit("UI component split markers not found")
          head_body = u[:pos]
          second_body = u[pos:tail]
          registrations = u[tail:u.rfind("\n}", tail)]
          class_names = re.findall(r'^  class (AIDC\\w+)', head_body, re.M)
          context_names = [
              "html","LitElement","icon","text","formatDate","shortId","getApplication",
              "statusBadge","emptyState","validateRedirectUri","diagnoseRedirectUri",
              "userAvatar","AIDCElement"
          ] + class_names
          context_names = list(dict.fromkeys(context_names))
          # AIDC destructured dependencies are already local in the first module.
          for n in ["state","api","auth","applications","redirectUris","scopes","credentials",
                    "branding","activity","applicationHealth","router","copyToClipboard",
                    "modals","haptic","notify"]:
              if n not in context_names:
                  context_names.append(n)
          context = ", ".join(context_names)
          ui_head = head_body + f'''  registerAIDCSecondaryComponents({{ {context} }});
{registrations}
}}
'''
          ui_head = ui_head.replace(
              'import {',
              'import { registerAIDCSecondaryComponents } from "./ui-components.js";\n\nimport {',
              1
          )
          ui.write_text(ui_head)

          helpers_import = u[:u.index('export function registerAIDCComponents')].replace(
              'export function registerAIDCComponents', '/*'
          )
          # Keep imports only, then create the second registration function.
          imports = u[:u.index('export function registerAIDCComponents')]
          secondary = imports + f'''
export function registerAIDCSecondaryComponents({{{context}}}) {{
{second_body}
{registrations}
}}
'''
          (root / "ui-components.js").write_text(secondary)

          # Split CSS at the nearest section boundary around the midpoint.
          css = root / "style.css"
          c = css.read_text()
          lines = c.splitlines(True)
          midpoint = len(lines) // 2
          split = max(i for i in range(midpoint, 0, -1) if lines[i].lstrip().startswith("/*"))
          css.write_text("".join(lines[:split]))
          (root / "style-components.css").write_text("".join(lines[split:]))

          # Serve the new frontend modules/styles.
          srv = server.read_text()
          srv = srv.replace(
              'app.get(\n  "/ui.js",\n  sendFrontendFile("ui.js")\n);',
              'app.get(\n  "/ui.js",\n  sendFrontendFile("ui.js")\n);\napp.get(\n  "/ui-components.js",\n  sendFrontendFile("ui-components.js")\n);'
          )
          srv = srv.replace(
              'app.get(\n  "/style.css",\n  sendFrontendFile("style.css")\n);',
              'app.get(\n  "/style.css",\n  sendFrontendFile("style.css")\n);\napp.get(\n  "/style-components.css",\n  sendFrontendFile("style-components.css")\n);'
          )
          server.write_text(srv)

          # Load the second stylesheet.
          index = root / "index.html"
          h = index.read_text()
          h = h.replace(
              '<link rel="stylesheet" href="/style.css?v=20261007-1">',
              '<link rel="stylesheet" href="/style.css?v=20261007-2">\\n  <link rel="stylesheet" href="/style-components.css?v=20261007-1">'
          )
          index.write_text(h)

          # Temporary workflow/script are removed before the generated commit.
          Path(".github/workflows/refactor-large-modules.yml").unlink()
          Path("tools/refactor_large_modules.py").unlink()

          print("server.js", len(server.read_text().splitlines()))
          print("server/api-routes.js", len(routes_path.read_text().splitlines()))
          print("ui.js", len(ui.read_text().splitlines()))
          print("ui-components.js", len((root / "ui-components.js").read_text().splitlines()))
          print("style.css", len(css.read_text().splitlines()))
          print("style-components.css", len((root / "style-components.css").read_text().splitlines()))
          